<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Casa</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0d1117; color: #f0f6fc; padding: 15px; height: 100vh; overflow: hidden; }
    
    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; background: #161b22; padding: 15px 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #30363d; height: 75px; }
    .clock { font-size: 2.2rem; font-weight: 700; color: #ffffff; }
    .weather { font-size: 1.3rem; font-weight: 600; display: flex; align-items: center; gap: 10px; color: #58a6ff; }

    /* Grid Layout */
    .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; height: calc(100vh - 120px); }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; }
    .card h2 { font-size: 1rem; color: #8b949e; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }

    iframe { width: 100%; height: 100%; border: none; border-radius: 8px; }
  </style>
</head>
<body>

  <header>
    <div class="clock" id="reloj">--:--</div>
    <div class="weather">
      <span style="color: #f0f6fc;">📍 Puente Alto, CL</span> | <span id="temp">Cargando...</span>
    </div>
  </header>

  <div class="grid-container">
    <!-- Columna Izquierda: Google Calendar -->
    <div class="card">
      <h2>📅 Agenda & Eventos</h2>
      <iframe src="https://calendar.google.com/calendar/embed?src=es.cl%23holiday%40group.v.calendar.google.com&ctz=America%2FSantiago"></iframe>
    </div>

    <!-- Columna Derecha: Spotify -->
    <div class="card">
      <h2>🎵 Spotify Player</h2>
      <iframe src="https://open.spotify.com/embed/playlist/37i9dQZF1DX4wy72EZ7Z9A?utm_source=generator&theme=0" height="100%" allow="encrypted-media"></iframe>
    </div>
  </div>

  <script>
    // 1. Reloj en tiempo real
    function actualizarReloj() {
      var ahora = new Date();
      var h = ahora.getHours();
      var m = ahora.getMinutes();
      var ampm = h >= 12 ? 'p. m.' : 'a. m.';
      h = h % 12;
      h = h ? h : 12;
      m = m < 10 ? '0' + m : m;
      document.getElementById('reloj').innerHTML = h + ':' + m + ' ' + ampm;
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    // 2. Clima vía JSONP (Evita bloqueos CORS y SSL de navegadores antiguos)
    function mostrarClima(data) {
      if (data && data.current_condition && data.current_condition[0]) {
        var temp = data.current_condition[0].temp_C;
        var desc = data.current_condition[0].lang_es ? data.current_condition[0].lang_es[0].value : '';
        document.getElementById('temp').innerHTML = temp + '°C ' + desc;
      }
    }

    function cargarClima() {
      var scriptAntiguo = document.getElementById('script-clima');
      if (scriptAntiguo) {
        scriptAntiguo.parentNode.removeChild(scriptAntiguo);
      }
      var script = document.createElement('script');
      script.id = 'script-clima';
      // Usamos protocolo relativo o HTTP directo para evitar rechazo de certificado en Android 4
      script.src = 'http://wttr.in/Puente+Alto?format=j1&lang=es&callback=mostrarClima';
      document.body.appendChild(script);
    }

    cargarClima();
    setInterval(cargarClima, 600000); // Actualiza cada 10 min
  </script>
</body>
</html>
