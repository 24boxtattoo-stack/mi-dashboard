<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Casa</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0d1117; color: #f0f6fc; padding: 15px; height: 100vh; overflow: hidden; }
    
    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; background: #161b22; padding: 15px 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #30363d; }
    .clock { font-size: 2.2rem; font-weight: 700; color: #ffffff; }
    .weather { font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }

    /* Grid Layout */
    .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; height: calc(100vh - 100px); }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; }
    .card h2 { font-size: 1rem; color: #8b949e; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }

    iframe { width: 100%; height: 100%; border: none; border-radius: 8px; }
  </style>
</head>
<body>

  <header>
    <div class="clock" id="reloj">00:00 AM</div>
    <div class="weather">
      <span>📍 Puente Alto, CL</span> | <span id="temp">--°C</span>
    </div>
  </header>

  <div class="grid-container">
    <!-- Columna Izquierda: Google Calendar -->
    <div class="card">
      <h2>📅 Agenda & Eventos</h2>
      <iframe src="https://calendar.google.com/calendar/embed?src=es.cl%23holiday%40group.v.calendar.google.com&ctz=America%2FSantiago"></iframe>
    </div>

    <!-- Columna Derecha: Spotify -->
    <div class="card">
      <h2>🎵 Spotify Player</h2>
      <iframe src="https://open.spotify.com/embed/playlist/37i9dQZF1DX4wy72EZ7Z9A?utm_source=generator&theme=0" height="100%" allow="encrypted-media"></iframe>
    </div>
  </div>

  <script>
    // Reloj compatible con versiones antiguas de JS (ES5)
    function actualizarReloj() {
      var ahora = new Date();
      var horas = ahora.getHours();
      var minutos = ahora.getMinutes();
      var ampm = horas >= 12 ? 'p. m.' : 'a. m.';
      
      horas = horas % 12;
      horas = horas ? horas : 12; // Formato 12 horas
      minutos = minutos < 10 ? '0' + minutos : minutos;

      document.getElementById('reloj').innerHTML = horas + ':' + minutos + ' ' + ampm;
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    // Clima compatible mediante XMLHttpRequest tradicional (sin fetch)
    function obtenerClima() {
      var xhr = new XMLHttpRequest();
      // Usamos el servicio wttr.in en formato JSON (muy liviano y altamente compatible)
      xhr.open('GET', 'https://wttr.in/Puente+Alto?format=j1', true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            try {
              var data = JSON.parse(xhr.responseText);
              var temp = data.current_condition[0].temp_C;
              document.getElementById('temp').innerHTML = temp + '°C';
            } catch(e) {
              document.getElementById('temp').innerHTML = 'N/A';
            }
          } else {
            // Si falla wttr.in, intenta con el respaldo de Open-Meteo
            obtenerClimaRespaldo();
          }
        }
      };
      xhr.send();
    }

    function obtenerClimaRespaldo() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'https://api.open-meteo.com/v1/forecast?latitude=-33.6167&longitude=-70.575&current_weather=true', true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4 && xhr.status === 200) {
          var data = JSON.parse(xhr.responseText);
          var temp = Math.round(data.current_weather.temperature);
          document.getElementById('temp').innerHTML = temp + '°C';
        }
      };
      xhr.send();
    }</body>
</html>
